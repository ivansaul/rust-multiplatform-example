[package]
name = "rusty-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
boltffi = "0.29.3"
postcard = { version = "1.1.3", features = ["alloc"] }
redb = "4.1.0"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"
